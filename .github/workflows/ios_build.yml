name: iOS & iPhone App Deploy (Memento Lock)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-iphone-webapp:
    name: Build & Deploy iPhone PWA (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Korean Font Fallback for Web/iOS
        run: |
          mkdir -p fonts
          curl -L -s -o fonts/malgunsl.ttf https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf
          cp fonts/malgunsl.ttf fonts/malgun.ttf

      - name: Build iOS Web App (PWA)
        run: |
          flutter pub get
          flutter build web --release --base-href "/memento_lock/" --pwa-strategy=none --no-wasm-dry-run

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-ios-ipa:
    name: Build Native iOS App (.ipa) on macOS
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Korean Font Assets
        run: |
          mkdir -p fonts
          curl -L -s -o fonts/malgunsl.ttf https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf
          cp fonts/malgunsl.ttf fonts/malgun.ttf

      - name: Install Dependencies & Run Unit Tests
        run: |
          flutter pub get
          flutter test

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Compile & Embed iOS WidgetKit Extension (.appex)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build/ios/iphoneos/Runner.app/PlugIns/MementoWidgetExtension.appex
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -application-extension \
            -O \
            ios/MementoWidgetExtension/MementoLockWidget.swift \
            -framework SwiftUI \
            -framework WidgetKit \
            -framework Foundation \
            -Xlinker -e -Xlinker _NSExtensionMain \
            -o build/ios/iphoneos/Runner.app/PlugIns/MementoWidgetExtension.appex/MementoWidgetExtension
          cp ios/MementoWidgetExtension/Info.plist build/ios/iphoneos/Runner.app/PlugIns/MementoWidgetExtension.appex/Info.plist
          chmod +x build/ios/iphoneos/Runner.app/PlugIns/MementoWidgetExtension.appex/MementoWidgetExtension
          codesign --force --sign - --entitlements ios/MementoWidgetExtension/MementoWidgetExtension.entitlements build/ios/iphoneos/Runner.app/PlugIns/MementoWidgetExtension.appex || true
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements build/ios/iphoneos/Runner.app || true

      - name: Package Unsigned .ipa Artifact
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r MementoLock-iOS-Unsigned.ipa Payload

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MementoLock-iOS-App
          path: MementoLock-iOS-Unsigned.ipa
